id: commerce
name: Trust & Commerce Readiness
version: 0.1.0
category: trust
summary: Reads what a visitor sees before trusting a website with money or an account - payment providers (Stripe, Paddle, Lemon Squeezy, PayPal and others), login, sign-up and checkout entry points, pricing, privacy, terms, refund and contact paths, and coming-soon or waitlist-only pages. Flags password fields on unencrypted pages. Feeds the Trust and Finish questions of the verdict.
stability: experimental
core_api: v0
targets: [website]
requires: [web-snapshot]
provides: [commerce]
findings: [insecure-credentials, missing-legal, missing-refund, missing-contact, coming-soon, pricing-stub]
scores: []
cost: low
execution:
  local: true
  network: none
  ai: none
privacy: Uses only the pages already fetched by the Website Snapshot. It never follows login or checkout links, submits forms or contacts payment providers, and sends nothing anywhere.
methodology: https://github.com/capybari-repo/capybari-analyzer-commerce/blob/main/docs/methodology.md
follow_ups:
  - capability: web-security
    reason: The site takes accounts or payments; check HTTPS, cookies and security headers.
